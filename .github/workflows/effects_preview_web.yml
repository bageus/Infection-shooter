name: Effects preview (web)
# Builds tools/effects_preview as a small standalone Web page. Run it by hand
# (Actions > Effects preview (web) > Run workflow) or on every change to the
# skill effects on main. The page is always attached as an artifact; it is
# also published to GitHub Pages when the repository variable
# EFFECTS_PREVIEW_PAGES is "true" (and Pages source is set to GitHub Actions).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/features/player/skill_fx/**'
      - 'game/features/player/mutation_skill_vfx.gd'
      - 'game/features/player/dash_trail.gd'
      - 'game/features/player/dash_floor_zone.gd'
      - 'game/features/player/range_dome.gd'
      - 'tools/effects_preview/**'
      - 'tools/build_effects_preview_web.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          bash tools/ci_download_godot.sh
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
      - name: Export the preview
        run: |
          set -o pipefail
          python3 tools/build_effects_preview_web.py /tmp/effects-web
          timeout 120 godot --headless --path /tmp/effects-web --editor --quit 2>&1 | tee /tmp/import.log
          timeout 120 godot --headless --path /tmp/effects-web --export-release Web build/index.html 2>&1 | tee /tmp/export.log
          if grep -E 'SHADER ERROR|SCRIPT ERROR|^ERROR:' /tmp/import.log /tmp/export.log; then exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/effects-web/build
  deploy:
    needs: build
    if: ${{ vars.EFFECTS_PREVIEW_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
