name: Prepare mission music
on:
  pull_request:
    paths:
      - 'tools/process_mission_music.py'
      - '.github/workflows/prepare_mission_music.yml'
permissions:
  contents: write
jobs:
  convert:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Readiness gates before implementation
        run: |
          python tools/validate_game_spec.py --ready
          python tools/validate_workflow_state.py --ready
      - name: Install offline audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install numpy==2.3.5
      - name: Verify and convert owner music
        run: python tools/process_mission_music.py
      - name: Commit verified outputs to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/music/tower_hold* assets/audio/music/tower_threat* assets/audio/music/server_oper_active* assets/audio/mission_music_processing.json
          if ! git diff --cached --quiet; then
            git commit -m "Convert and verify owner mission music assets"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
