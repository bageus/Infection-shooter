name: Mutation feedback verification
on:
  push:
    branches: [verify/mutation-feedback-20260930]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
      - name: Import
        run: timeout 240 godot --headless --path . --editor --quit
      - name: Runtime regressions
        shell: bash
        run: |
          set -o pipefail
          for suite in game/features/infection/tests/run_tests.gd game/bootstrap/app/tests/run_mutation_feedback_tests.gd game/features/player/tests/run_control_loss_tests.gd game/presentation/prototype_hud/tests/run_weapon_icon_tests.gd game/presentation/office_floor/tests/run_blood_effects_tests.gd game/presentation/office_floor/tests/run_elevator_collision_tests.gd; do
            timeout 120 godot --headless --path . --script "$suite" 2>&1 | tee /tmp/suite.log
            if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/suite.log; then exit 1; fi
          done
      - name: Main scene
        run: |
          timeout 120 godot --headless --path . --quit-after 180 2>&1 | tee /tmp/main.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/main.log; then exit 1; fi
      - name: Project validator
        continue-on-error: true
        run: python tools/validate_project.py
