name: Architecture validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project gates
        run: python tools/validate_project.py
      - name: Validate scene resources and workstation profiles
        run: |
          python tools/validate_scene_resources.py
          python tools/check_resource_paths.py
          python tools/deduplicate_model_textures.py --check
          python tools/test_texture_deduplication.py
          python tools/build_display_surfaces.py --check
          python tools/check_model_textures.py
          python tools/test_model_textures.py
          python tools/test_workstation_templates.py
          python tools/test_architecture_scene_access.py
