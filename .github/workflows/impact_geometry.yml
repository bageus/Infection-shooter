name: Impact geometry regressions
on:
  push:
    branches: [main]
    paths:
      - 'game/features/combat/impact_*geometry.gd'
      - 'game/features/combat/impact_triangle_index.gd'
      - 'game/features/combat/impact_receiver_cache.gd'
      - 'game/features/combat/impact_cache_watch.gd'
      - 'game/features/combat/tests/run_impact_geometry_index_tests.gd'
      - 'game/core/vfx/**'
      - 'game/features/combat/public/grenade_explosion.gd'
      - 'game/features/combat/tests/run_grenade_vfx_tests.gd'
      - 'game/features/infection_source/mutagen_cloud.gd'
      - 'models/objects/textures/mutagen/**'
      - 'game/presentation/office_floor/interactive_door.gd'
      - 'game/presentation/office_floor/door_presence.gd'
      - 'game/presentation/office_floor/blood_mark_budget.gd'
      - 'game/presentation/office_floor/blood_texture_library.gd'
      - 'game/presentation/office_floor/blood_decal_prop.gd'
      - 'game/presentation/office_floor/tests/run_blood_decor_tests.gd'
      - 'models/objects/textures/blood_decals_45/**'
      - 'game/presentation/office_floor/tests/run_door_runtime_tests.gd'
      - 'game/presentation/office_floor/tests/run_blood_effects_tests.gd'
      - 'game/features/infected/body_part*.gd'
      - 'game/features/infected/tests/run_body_topology_tests.gd'
      - 'game/features/infected/tests/fixtures/body_piece_baseline.gd'
      - 'game/presentation/office_floor/blood_mark_fifo.gd'
      - 'game/presentation/office_floor/tests/run_blood_fifo_tests.gd'
      - '.github/workflows/impact_geometry.yml'
  pull_request:
    paths:
      - 'game/features/combat/impact_*geometry.gd'
      - 'game/features/combat/impact_triangle_index.gd'
      - 'game/features/combat/impact_receiver_cache.gd'
      - 'game/features/combat/impact_cache_watch.gd'
      - 'game/features/combat/tests/run_impact_geometry_index_tests.gd'
      - 'game/core/vfx/**'
      - 'game/features/combat/public/grenade_explosion.gd'
      - 'game/features/combat/tests/run_grenade_vfx_tests.gd'
      - 'game/features/infection_source/mutagen_cloud.gd'
      - 'models/objects/textures/mutagen/**'
      - 'game/presentation/office_floor/interactive_door.gd'
      - 'game/presentation/office_floor/door_presence.gd'
      - 'game/presentation/office_floor/blood_mark_budget.gd'
      - 'game/presentation/office_floor/blood_texture_library.gd'
      - 'game/presentation/office_floor/blood_decal_prop.gd'
      - 'game/presentation/office_floor/tests/run_blood_decor_tests.gd'
      - 'models/objects/textures/blood_decals_45/**'
      - 'game/presentation/office_floor/tests/run_door_runtime_tests.gd'
      - 'game/presentation/office_floor/tests/run_blood_effects_tests.gd'
      - 'game/features/infected/body_part*.gd'
      - 'game/features/infected/tests/run_body_topology_tests.gd'
      - 'game/features/infected/tests/fixtures/body_piece_baseline.gd'
      - 'game/presentation/office_floor/blood_mark_fifo.gd'
      - 'game/presentation/office_floor/tests/run_blood_fifo_tests.gd'
      - '.github/workflows/impact_geometry.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o /tmp/godot.zip https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
      - name: Isolated impact geometry regression
        shell: bash
        run: |
          set -o pipefail
          # These private helpers depend only on engine types, never game assets.
          mkdir -p /tmp/impact_geometry/game/features/combat/tests
          echo 'config_version=5' > /tmp/impact_geometry/project.godot
          cp game/features/combat/impact_cache_watch.gd game/features/combat/impact_surface_geometry.gd game/features/combat/impact_triangle_index.gd game/features/combat/impact_receiver_cache.gd /tmp/impact_geometry/game/features/combat/
          cp game/features/combat/tests/run_impact_geometry_index_tests.gd /tmp/impact_geometry/game/features/combat/tests/
          timeout 120 godot --headless --path /tmp/impact_geometry --script res://game/features/combat/tests/run_impact_geometry_index_tests.gd 2>&1 | tee /tmp/impact_geometry.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/impact_geometry.log; then exit 1; fi
          mkdir -p /tmp/impact_geometry/game/core
          cp -r game/core/vfx /tmp/impact_geometry/game/core/
          timeout 120 godot --headless --path /tmp/impact_geometry --script res://game/core/vfx/tests/run_stamp_cache_tests.gd 2>&1 | tee /tmp/stamp_cache.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/stamp_cache.log; then exit 1; fi
          mkdir -p /tmp/impact_geometry/game/presentation/office_floor/tests
          cp game/presentation/office_floor/blood_mark_fifo.gd /tmp/impact_geometry/game/presentation/office_floor/
          cp game/presentation/office_floor/tests/run_blood_fifo_tests.gd /tmp/impact_geometry/game/presentation/office_floor/tests/
          timeout 120 godot --headless --path /tmp/impact_geometry --script res://game/presentation/office_floor/tests/run_blood_fifo_tests.gd 2>&1 | tee /tmp/blood_fifo.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/blood_fifo.log; then exit 1; fi
          mkdir -p /tmp/impact_geometry/game/features/infected/tests/fixtures
          cp game/features/infected/body_part_mesh.gd game/features/infected/body_part_topology.gd game/features/infected/body_wound.gdshader /tmp/impact_geometry/game/features/infected/
          cp game/features/infected/tests/run_body_topology_tests.gd /tmp/impact_geometry/game/features/infected/tests/
          cp game/features/infected/tests/fixtures/body_piece_baseline.gd /tmp/impact_geometry/game/features/infected/tests/fixtures/
          timeout 120 godot --headless --path /tmp/impact_geometry --script res://game/features/infected/tests/run_body_topology_tests.gd 2>&1 | tee /tmp/body_topology.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/body_topology.log; then exit 1; fi
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o /tmp/godot.zip https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
      - name: Import and targeted mission integration
        shell: bash
        run: |
          set -o pipefail
          timeout 240 godot --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/import.log; then exit 1; fi
          timeout 60 godot --headless --path . res://game/bootstrap/app/main.tscn --quit-after 10 2>&1 | tee /tmp/main.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/main.log; then exit 1; fi
          for suite in game/presentation/office_floor/tests/run_blood_decor_tests.gd game/bootstrap/app/tests/run_gameplay_planner_repairs_tests.gd game/presentation/office_floor/tests/run_door_runtime_tests.gd game/presentation/office_floor/tests/run_blood_effects_tests.gd game/features/combat/tests/run_grenade_vfx_tests.gd game/features/infected/tests/run_body_topology_tests.gd; do
            timeout 120 godot --headless --path . --script "$suite" 2>&1 | tee /tmp/integration.log
            if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/integration.log; then exit 1; fi
          done
