name: Impact geometry regressions
on:
  push:
    branches: [main]
    paths:
      - 'game/features/combat/impact_*geometry.gd'
      - 'game/features/combat/impact_triangle_index.gd'
      - 'game/features/combat/impact_receiver_cache.gd'
      - 'game/features/combat/tests/run_impact_geometry_index_tests.gd'
      - '.github/workflows/impact_geometry.yml'
  pull_request:
    paths:
      - 'game/features/combat/impact_*geometry.gd'
      - 'game/features/combat/impact_triangle_index.gd'
      - 'game/features/combat/impact_receiver_cache.gd'
      - 'game/features/combat/tests/run_impact_geometry_index_tests.gd'
      - '.github/workflows/impact_geometry.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o /tmp/godot.zip https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
      - name: Isolated impact geometry regression
        shell: bash
        run: |
          set -o pipefail
          # These private helpers depend only on engine types, never game assets.
          mkdir -p /tmp/impact_geometry/game/features/combat/tests
          echo 'config_version=5' > /tmp/impact_geometry/project.godot
          cp game/features/combat/impact_surface_geometry.gd game/features/combat/impact_triangle_index.gd game/features/combat/impact_receiver_cache.gd /tmp/impact_geometry/game/features/combat/
          cp game/features/combat/tests/run_impact_geometry_index_tests.gd /tmp/impact_geometry/game/features/combat/tests/
          timeout 120 godot --headless --path /tmp/impact_geometry --script res://game/features/combat/tests/run_impact_geometry_index_tests.gd 2>&1 | tee /tmp/impact_geometry.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/impact_geometry.log; then exit 1; fi
