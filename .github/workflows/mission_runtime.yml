name: Mission runtime regressions
on:
  push:
    branches: [verify/carpet-shadow-20260930]
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o /tmp/godot.zip https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
      - name: Import
        run: timeout 240 godot --headless --path . --editor --quit
      - name: Project gates and resource profiles
        run: |
          python tools/validate_project.py
          python tools/validate_scene_resources.py
          python tools/test_workstation_templates.py
          python tools/test_glass_openings.py
          python tools/test_architecture_scene_access.py
      - name: Runtime regressions
        shell: bash
        run: |
          set -o pipefail
          for suite in game/features/infection/tests/run_tests.gd game/bootstrap/app/tests/run_mutation_feedback_tests.gd game/features/player/tests/run_control_loss_tests.gd game/presentation/prototype_hud/tests/run_weapon_icon_tests.gd game/presentation/office_floor/tests/run_blood_effects_tests.gd game/presentation/office_floor/tests/run_elevator_collision_tests.gd game/features/infected/tests/run_blood_events_tests.gd game/features/pickups/tests/run_pickup_floor_tests.gd game/bootstrap/app/tests/run_planning_mode_tests.gd game/bootstrap/app/tests/run_world_bindings_tests.gd game/bootstrap/app/tests/run_lighting_tests.gd game/bootstrap/app/tests/run_global_lighting_tests.gd; do
            timeout 120 godot --headless --path . --script "$suite" 2>&1 | tee /tmp/suite.log
            if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/suite.log; then exit 1; fi
          done
      - name: Main scene
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --quit-after 180 2>&1 | tee /tmp/main.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/main.log; then exit 1; fi
