name: Mission runtime regressions
on:
  push:
    branches: [main]
    # Docs-only changes cannot affect Godot runs; architecture.yml still runs the project gates on every PR.
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
permissions:
  contents: read
concurrency:
  # New namespace lets cancellable runs start while legacy always() jobs drain.
  group: ${{ github.workflow }}-cancellable-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true
# Avoid llvmpipe oversubscription on shared CI CPUs; both real renderers remain enabled.
env:
  LP_NUM_THREADS: 4

jobs:
  enemy-skin-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test Godot template download recovery
        run: python3 tools/test_godot_template_download.py
      - name: Install Godot and software renderer
        run: |
          bash tools/ci_download_godot.sh
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - name: Import and native layer isolation
        run: |
          set -o pipefail
          mkdir -p /tmp/skin-review
          timeout 600 godot --headless --path . --editor --quit 2>&1 | tee /tmp/skin-review/import.log
          timeout 120 xvfb-run -a godot --verbose --path . --audio-driver Dummy --rendering-method gl_compatibility --script game/features/infected/tests/run_shared_skin_tests.gd 2>&1 | tee /tmp/skin-review/layers.log
          if grep -E 'SHADER ERROR|SCRIPT ERROR|^ERROR:' /tmp/skin-review/*.log; then exit 1; fi
      - name: Compare base and candidate pixels and draw calls
        run: |
          set -o pipefail
          mkdir -p /tmp/skin-base/tools
          git fetch origin d7245e79226662ce3ac4e0e2f761db585b855a2e --depth=1
          git archive d7245e79226662ce3ac4e0e2f761db585b855a2e game project.godot default_bus_layout.tres | tar -x -C /tmp/skin-base
          for item in models assets addons .godot; do ln -s "$PWD/$item" "/tmp/skin-base/$item"; done
          cp tools/capture_enemy_skins.gd tools/bench_enemy_materials.gd /tmp/skin-base/tools/
          for revision in before after; do
            project="$PWD"
            if [ "$revision" = before ]; then project=/tmp/skin-base; fi
            timeout 180 xvfb-run -a godot --path "$project" --fixed-fps 60 --audio-driver Dummy --rendering-method gl_compatibility --script tools/capture_enemy_skins.gd -- "/tmp/skin-review/$revision" 2>&1 | tee "/tmp/skin-review/$revision-capture.log"
            timeout 180 xvfb-run -a godot --path "$project" --fixed-fps 60 --audio-driver Dummy --rendering-method gl_compatibility --script tools/bench_enemy_materials.gd -- --wounded 2>&1 | tee "/tmp/skin-review/$revision-bench.log"
          done
          if grep -E 'SHADER ERROR|SCRIPT ERROR|^ERROR:' /tmp/skin-review/*.log; then exit 1; fi
      - name: WebGL2 skin layers and page boundary
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 tools/build_web_skin_probe.py /tmp/web-skin
          timeout 60 godot --headless --path /tmp/web-skin --editor --quit 2>&1 | tee /tmp/skin-review/web-import.log
          timeout 60 godot --headless --path /tmp/web-skin --export-release Web build/index.html 2>&1 | tee /tmp/skin-review/web-export.log
          timeout 120 node tools/run_web_skin_probe.mjs /tmp/web-skin/build /tmp/skin-review/web 2>&1 | tee /tmp/skin-review/web-browser.log
          if grep -E 'SHADER ERROR|SCRIPT ERROR|^ERROR:' /tmp/skin-review/web-*.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 14
          name: enemy-skin-review
          path: /tmp/skin-review
  prop-optimization-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and software renderer
        run: |
          bash tools/ci_download_godot.sh
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - name: Import
        run: |
          set -o pipefail
          timeout 600 godot --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/import.log; then exit 1; fi
      - name: Native prop regression and shadow comparison
        run: |
          set -o pipefail
          mkdir -p /tmp/prop-review
          timeout 120 xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script game/presentation/office_floor/tests/run_prop_shadow_tests.gd 2>&1 | tee /tmp/prop-review/shadows.log
          if grep -E 'SHADER ERROR|SCRIPT ERROR|^ERROR:' /tmp/prop-review/shadows.log; then exit 1; fi
          timeout 180 xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script tools/capture_prop_shadow_budget.gd -- --baseline --output=/tmp/prop-review/before 2>&1 | tee /tmp/prop-review/before.log
          if grep -E 'SHADER ERROR|SCRIPT ERROR|^ERROR:' /tmp/prop-review/before.log; then exit 1; fi
          timeout 180 xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script tools/capture_prop_shadow_budget.gd -- --output=/tmp/prop-review/after 2>&1 | tee /tmp/prop-review/after.log
          if grep -E 'SHADER ERROR|SCRIPT ERROR|^ERROR:' /tmp/prop-review/after.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: prop-optimization-review
          path: /tmp/prop-review
  weapon-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        renderer: [gl_compatibility, forward_plus]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and software renderer
        run: |
          bash tools/ci_download_godot.sh
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - name: Import
        run: |
          set -o pipefail
          timeout 600 godot --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/import.log; then exit 1; fi
      - name: Weapon scope pixels and equipment
        env:
          POSE_CAPTURE_DIR: /tmp/weapon-previews
        run: |
          mkdir -p /tmp/weapon-previews
          set -o pipefail
          timeout 180 xvfb-run -a godot --verbose --path . --audio-driver Dummy --rendering-method ${{ matrix.renderer }} --script game/bootstrap/app/tests/run_new_weapon_tests.gd 2>&1 | tee /tmp/weapon.log
          if grep -E 'SHADER ERROR|SCRIPT ERROR|^ERROR:' /tmp/weapon.log; then exit 1; fi
      - name: Native display resolution and window modes
        run: |
          set -o pipefail
          timeout 120 xvfb-run -a -s "-screen 0 1920x1080x24" godot --path . --audio-driver Dummy --rendering-method ${{ matrix.renderer }} --script game/bootstrap/app/tests/run_display_settings_tests.gd 2>&1 | tee /tmp/display-native.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/display-native.log; then exit 1; fi
      - name: Native music and positional audio lifecycle
        run: |
          set -o pipefail
          for suite in game/bootstrap/app/tests/run_adaptive_audio_tests.gd game/presentation/office_floor/tests/run_server_audio_tests.gd; do
            timeout 120 xvfb-run -a godot --path . --audio-driver Dummy --rendering-method ${{ matrix.renderer }} --script "$suite" 2>&1 | tee /tmp/audio-native.log
            if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/audio-native.log; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: weapon-rendering-${{ matrix.renderer }}
          path: |
            /tmp/weapon-previews/*
            /tmp/weapon.log
            /tmp/display-native.log
            /tmp/import.log
  effects-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and software renderer
        run: |
          bash tools/ci_download_godot.sh
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - name: Import
        run: |
          set -o pipefail
          timeout 600 godot --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/import.log; then exit 1; fi
      - name: Rendered effects smoke
        env:
          POSE_CAPTURE_DIR: /tmp/effects-smoke
        run: |
          mkdir -p /tmp/effects-smoke
          set -o pipefail
          failed=0
          for suite in game/presentation/office_floor/tests/run_hit_effect_tests.gd game/features/combat/tests/run_grenade_vfx_tests.gd game/features/infection_source/tests/run_mutagen_cloud_tests.gd game/presentation/office_floor/tests/run_contact_shadow_tests.gd game/features/infected/tests/run_enemy_animation_tests.gd; do
            log=/tmp/effects-smoke/$(basename "$suite" .gd).log
            status=0
            timeout 150 xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script "$suite" > "$log" 2>&1 || status=$?
            cat "$log"
            if [ "$status" != 0 ] || grep -E 'Failed loading resource|SHADER ERROR|SCRIPT ERROR|failure\(s\)|failures' "$log" | grep -vE ' 0 failure| 0 failures'; then
              failed=1
              echo "::error title=Rendered smoke failed::$suite exited $status :: $(grep -E 'ERROR|failure|at: ' "$log" | head -6 | tr '\n' ' ' | cut -c1-900)"
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: effects-smoke
          path: |
            /tmp/effects-smoke/*
            /tmp/import.log
  planner-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        renderer: [gl_compatibility, forward_plus]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and software renderer
        run: |
          bash tools/ci_download_godot.sh
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - name: Import
        run: |
          set -o pipefail
          timeout 600 godot --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/import.log; then exit 1; fi
      - name: Planner aim and occlusion lifecycle
        env:
          POSE_CAPTURE_DIR: /tmp/planner-previews
          OCCLUSION_CAPTURE_DIR: /tmp/planner-previews
        run: |
          mkdir -p /tmp/planner-previews
          set -o pipefail
          failed=0
          for suite in run_planner_contact_tests run_planner_extension_tests run_occlusion_tests run_p2_optimization_tests; do
            timeout 300 xvfb-run -a godot --verbose --path . --audio-driver Dummy --rendering-method ${{ matrix.renderer }} --script game/bootstrap/app/tests/${suite}.gd 2>&1 | tee /tmp/planner-previews/${suite}.log || failed=1
            if grep -E 'SHADER ERROR|SCRIPT ERROR|^ERROR:' /tmp/planner-previews/${suite}.log; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: planner-rendering-${{ matrix.renderer }}
          path: |
            /tmp/planner-previews/*
            /tmp/import.log
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          bash tools/ci_download_godot.sh
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo ln -s /tmp/godot/Godot* /usr/local/bin/godot
      - name: Import
        run: |
          set -o pipefail
          timeout 600 godot --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/import.log; then exit 1; fi
      - name: Export PCK inventory and packed mission smoke
        run: |
          set -o pipefail
          for preset in "Windows Desktop" "Web"; do
            key=$(echo "$preset" | tr ' ' '_')
            pack=/tmp/optimization_${key}.pck
            inventory=/tmp/optimization_${key}.json
            timeout 180 godot --headless --path . --export-pack "$preset" "$pack" > /tmp/export_${key}.log 2>&1
            if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/export_${key}.log; then exit 1; fi
            EXPORT_INVENTORY="$inventory" timeout 60 godot --headless --main-pack "$pack" --script "$PWD/tools/audit_export_pack.gd"
            python tools/check_export_pack.py --inventory "$inventory"
            timeout 120 godot --headless --main-pack "$pack" res://game/bootstrap/app/main.tscn --quit-after 180 > /tmp/packed_${key}.log 2>&1
            if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/packed_${key}.log; then exit 1; fi
          done
      - name: Group 04 atlas and destruction
        if: always()
        run: |
          set -o pipefail
          python tools/check_group04_atlas.py
          timeout 120 godot --headless --path . --script game/bootstrap/app/tests/run_group04_asset_tests.gd 2>&1 | tee /tmp/group04.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/group04.log; then exit 1; fi
      - name: Imported model textures
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script game/bootstrap/app/tests/run_model_texture_tests.gd 2>&1 | tee /tmp/model-textures.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/model-textures.log; then exit 1; fi
      - name: Updated electronic displays
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --script game/presentation/office_floor/tests/run_display_tests.gd 2>&1 | tee /tmp/displays.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/displays.log; then exit 1; fi
      - name: Project gates and resource profiles
        run: |
          python tools/validate_project.py
          python tools/check_import_files.py
          python tools/validate_scene_resources.py
          python tools/check_resource_paths.py
          python tools/deduplicate_model_textures.py --check
          python tools/test_texture_deduplication.py
          python tools/test_workstation_templates.py
          python tools/test_glass_openings.py
          python tools/test_architecture_scene_access.py
      - name: Runtime regressions
        shell: bash
        run: |
          set -o pipefail
          # Longest suites first across three lanes. Each suite has its own user:// data.
          python tools/validate_ci_suites.py
          tools/run_runtime_suites.sh .github/runtime_suites.txt /tmp/runtime-suites 3

      - name: Main scene
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . res://game/bootstrap/app/main.tscn --quit-after 180 2>&1 | tee /tmp/main.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/main.log; then exit 1; fi
      - name: Capture menu screens
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
          timeout 180 xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script game/bootstrap/app/tests/capture_menu_screens.gd
      - name: Occlusion and blast pixels in both renderers
        env:
          OCCLUSION_CAPTURE_DIR: /tmp/menu_previews
          DISPLAY_CAPTURE_DIR: /tmp/menu_previews
          POSE_CAPTURE_DIR: /tmp/menu_previews
          RUNTIME_PROFILE_DIR: /tmp/menu_previews
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          failed=0
          for renderer in gl_compatibility forward_plus; do
            for suite in game/presentation/prototype_hud/tests/run_vital_bar_feedback_tests.gd game/bootstrap/app/tests/run_planner_light_view_tests.gd game/presentation/office_floor/tests/run_display_shadow_profile.gd game/presentation/prototype_hud/tests/run_radar_tests.gd game/presentation/office_floor/tests/run_floor_batch_tests.gd game/features/combat/tests/run_grenade_vfx_tests.gd game/features/infected/tests/run_corpse_physics_tests.gd game/bootstrap/app/tests/run_settings_tabs_tests.gd game/bootstrap/app/tests/run_surface_pose_tests.gd game/features/combat/tests/run_cursor_aim_tests.gd game/bootstrap/app/tests/run_gameplay_planner_repairs_tests.gd game/bootstrap/app/tests/run_runtime_debug_tests.gd game/bootstrap/app/tests/run_blast_feedback_tests.gd; do
              suite_status=0
              started_at=$(date +%s)
              # 300 s: full-mission rendered suites run 85-200 s on the software renderer (run_runtime_debug_tests: 84 s this morning, ~190 s on current main) and 180 s+ on shared runners.
              timeout 300 xvfb-run -a godot --path . --audio-driver Dummy --rendering-method "$renderer" --script "$suite" > /tmp/occlusion.log 2>&1 || suite_status=$?
              elapsed=$(( $(date +%s) - started_at ))
              echo "$renderer: $suite exited $suite_status in ${elapsed}s"
              if [ "$suite_status" != 0 ]; then
                failed=1
                echo "::error title=Rendered suite exit::$renderer $suite exited $suite_status in ${elapsed}s"
              fi
              cp /tmp/occlusion.log /tmp/menu_previews/$(basename "$suite" .gd)_${renderer}.log
              cat /tmp/occlusion.log
              if grep -E 'SHADER ERROR|SCRIPT ERROR|^ERROR:' /tmp/occlusion.log; then failed=1; fi
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: menu-previews
          path: |
            /tmp/menu_previews/*
            /tmp/import.log
            /tmp/main.log
            /tmp/rendered.log
            /tmp/group04.log
